<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RIO-CARIBE v14.2 REAL 843 - DUE Oficial - FIX TOTAL</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #e5e7eb; margin: 0; padding: 20px; }
    .card { background: rgba(17,24,39,.85); border:1px solid #374151; border-radius: 12px; padding: 18px; margin: 12px 0; }
    .button { background:#10b981; color:#03110a; border:none; border-radius:8px; padding:10px 14px; cursor:pointer; font-weight:700; }
    .small { color:#9ca3af; font-size:12px; }
    #syncLog { white-space: pre-wrap; font-family: monospace; font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Sync REAL - R-TEC-01</h2>
    <button class="button" onclick="syncDUEOnline()">Sync DUE Online</button>
    <div class="small" id="cacheCount">Cache: 0 REAL</div>
    <div class="small" id="kpiCache">KPI Cache: 0 REAL</div>
    <div id="syncLog"></div>
  </div>

  <script>
    var DUE_API_BASE = "https://www.datos.gov.co/resource/9ct3-92f5.json";
    var CACHE_KEY = "rio_caribe_due_real_cache_v14_2";
    var dueRealCache = [];

    function normalizeKey(value) {
      return String(value || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]/g, "");
    }

    function detectDaneFields(rows) {
      var sample = Array.isArray(rows) ? rows.find(function (row) { return row && typeof row === "object"; }) : null;
      if (!sample) return { departamento: null, municipio: null, departamentoCodigo: null, municipioCodigo: null };

      var keys = Object.keys(sample);
      var best = { departamento: null, municipio: null, departamentoCodigo: null, municipioCodigo: null };

      keys.forEach(function (key) {
        var norm = normalizeKey(key);

        if (!best.departamentoCodigo && /(codigo.*dane.*depart|codigo.*depart.*dane|dane.*depart.*codigo|depart.*dane.*codigo|codigodane.*depart|departamentocodigo)/.test(norm)) {
          best.departamentoCodigo = key;
        }

        if (!best.municipioCodigo && /(codigo.*dane.*mun|codigo.*mun.*dane|dane.*mun.*codigo|mun.*dane.*codigo|codigodane.*mun|municipiocodigo)/.test(norm)) {
          best.municipioCodigo = key;
        }

        if (!best.departamento && /(departamento|dpto|nombredepartamento|departamentonombre)/.test(norm)) {
          best.departamento = key;
        }

        if (!best.municipio && /(municipio|ciudad|nombremunicipio|municipionombre)/.test(norm)) {
          best.municipio = key;
        }
      });

      if (!best.departamentoCodigo && !best.departamento) {
        keys.forEach(function (key) {
          var norm = normalizeKey(key);
          if (!best.departamentoCodigo && /depart/.test(norm) && /codigo/.test(norm)) best.departamentoCodigo = key;
          if (!best.departamento && /depart/.test(norm)) best.departamento = key;
        });
      }

      if (!best.municipioCodigo && !best.municipio) {
        keys.forEach(function (key) {
          var norm = normalizeKey(key);
          if (!best.municipioCodigo && /mun/.test(norm) && /codigo/.test(norm)) best.municipioCodigo = key;
          if (!best.municipio && /mun/.test(norm)) best.municipio = key;
        });
      }

      return best;
    }

    function updateCacheUI() {
      var c = document.getElementById("cacheCount");
      if (c) c.innerText = "Cache: " + dueRealCache.length + " REAL";
      var k = document.getElementById("kpiCache");
      if (k) k.innerText = "KPI Cache: " + dueRealCache.length + " REAL";
    }

    function logSync(m) {
      var l = document.getElementById("syncLog");
      if (!l) return;
      var t = new Date().toLocaleTimeString();
      l.innerHTML = "[" + t + "] " + m + "\n" + l.innerHTML;
    }

    function loadCacheReal() {
      try {
        var raw = localStorage.getItem(CACHE_KEY);
        if (raw) dueRealCache = JSON.parse(raw);
      } catch (e) {}
      updateCacheUI();
    }

    function saveCacheReal() {
      localStorage.setItem(CACHE_KEY, JSON.stringify(dueRealCache));
      updateCacheUI();
    }

    function syncDUEOnline() {
      if (!navigator.onLine) {
        logSync("OFFLINE - Usando cache " + dueRealCache.length + " REALES - 0 Bytes WAN");
        return;
      }

      logSync("ONLINE - Fetching DUE REAL...");

      var url = DUE_API_BASE + "?$limit=2000";

      fetch(url)
        .then(function (response) {
          if (!response.ok) {
            throw new Error("HTTP " + response.status);
          }
          return response.json();
        })
        .then(function (rows) {
          if (!Array.isArray(rows) || rows.length === 0) {
            logSync("Sync ERROR - 0 REALES");
            return;
          }

          var daneFields = detectDaneFields(rows);
          var total = Math.min(rows.length, 2000);
          dueRealCache = rows.slice(0, total);
          saveCacheReal();

          var detalle = [];
          if (daneFields.departamentoCodigo || daneFields.municipioCodigo || daneFields.departamento || daneFields.municipio) {
            detalle.push("DANE detectado: " + [daneFields.departamentoCodigo, daneFields.municipioCodigo, daneFields.departamento, daneFields.municipio].filter(Boolean).join(" | "));
          }

          logSync("Sync OK " + dueRealCache.length + " REALES" + (detalle.length ? " - " + detalle.join(" ; ") : ""));
        })
        .catch(function (error) {
          logSync("Sync ERROR - " + (error && error.message ? error.message : "fallo de conexión"));
        });
    }

    window.addEventListener("DOMContentLoaded", function () {
      loadCacheReal();
    });
  </script>
</body>
</html>
